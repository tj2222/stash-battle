name: Stash Battle
description: Adds an ELO based ranking system for scenes
version: 2.6.4
url: https://github.com/dtt-git/stash-battle
exec:
  - python
  - "{pluginDir}/stash-battle.py"
interface: raw
ui:
  javascript:
    - stash-battle.js
    - leaderboard.js
  css:
    - stash-battle.css
  assets:
    /: assets
tasks:
  - name: Generate Leaderboard
    description: Generates the performer leaderboard HTML file.